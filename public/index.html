<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calendário Editorial Loy4biz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: fixed backdrop (soft glows + large brand logo, bottom right) → masthead → one glass panel holding month
   navigation, filters and the month grid; near-solid drawer for details; below 760px a date-grouped list.
   Two modes on <html data-ui>: dark (navy + electric blue, the original look) and light (white + Loy4biz gray #6E6F73,
   brand blue #2201F0 as accent). The art area (#E6E6E6) is the same in both. */
:root{
  color-scheme:dark;
  --bg:#040A22; --bg-2:#081436; --band:#040A22;
  --electric:#2F6BFF; --electric-hover:#4A80FF; --electric-bright:#8EAEFF; --accent-shadow:rgba(47,107,255,.34);
  --glow-a:rgba(47,107,255,.28); --glow-b:rgba(34,1,240,.36); --glow-c:rgba(47,107,255,.08);
  --logo-opacity:.22;
  --glass:rgba(8,20,58,.55); --glass-blur:10px; --glass-line:rgba(255,255,255,.12);
  --glass-shadow:0 30px 80px rgba(1,4,18,.45),inset 0 1px 0 rgba(255,255,255,.05);
  --mast:rgba(4,10,34,.6); --mast-line:rgba(255,255,255,.08); --mast-ink:#FFFFFF; --mast-ink-2:#C8D2EC; --mast-muted:#94A3C9;
  --mast-ctl:rgba(255,255,255,.06); --mast-ctl-line:rgba(255,255,255,.14);
  --card:rgba(17,34,88,.86); --card-hover:rgba(23,44,108,.94); --card-line:rgba(255,255,255,.10);
  --card-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05); --lift-shadow:0 10px 24px rgba(1,4,18,.45);
  --pop:rgba(10,22,62,.95); --pop-shadow:0 28px 60px rgba(1,4,18,.6);
  --solid:rgba(9,20,56,.97); --solid-head:#0C1A4A; --drawer-shadow:-30px 0 80px rgba(1,4,18,.55);
  --inset:rgba(255,255,255,.045); --inset-line:rgba(255,255,255,.09);
  --divider:rgba(255,255,255,.075); --out-day:rgba(2,6,22,.14);
  --ctl:rgba(255,255,255,.06); --ctl-hover:rgba(255,255,255,.1); --ctl-line:rgba(255,255,255,.16);
  --dash:rgba(255,255,255,.24);
  --field:rgba(255,255,255,.05); --field-focus:rgba(255,255,255,.07); --field-line:rgba(255,255,255,.18);
  --ink:#FFFFFF; --ink-2:#C8D2EC; --muted:#94A3C9; --on-accent:#FFFFFF;
  --press:rgba(142,174,255,.18); --press-line:rgba(142,174,255,.55);
  --more-bg:rgba(47,107,255,.12); --more-bg-hover:rgba(47,107,255,.22); --more-line:rgba(142,174,255,.3);
  --info-bg:rgba(47,107,255,.14); --info-line:rgba(142,174,255,.35);
  --overlay:rgba(2,6,20,.55);
  --toast-bg:#EEF2FF; --toast-fg:#0A1640;
  --warn-bg:#F28B80; --warn-fg:#2A0B08;
  --art-bg:rgba(255,255,255,.05);
  --avatar-ed-bg:rgba(47,107,255,.22); --avatar-ed-fg:#CFDCFF; --avatar-ed-line:rgba(142,174,255,.35);
  --avatar-ap-bg:#EEF2FF; --avatar-ap-fg:#0A1640;
  --st-draft-fg:#CDD5EA; --st-draft-bg:rgba(205,213,234,.12); --st-draft-dot:#9AA7C7; --st-draft-line:rgba(205,213,234,.24);
  --st-pending-fg:#FFD27A; --st-pending-bg:rgba(242,174,53,.16); --st-pending-dot:#F2AE35; --st-pending-line:rgba(242,174,53,.38);
  --st-changes-fg:#FFB2AA; --st-changes-bg:rgba(242,106,93,.17); --st-changes-dot:#F26A5D; --st-changes-line:rgba(242,106,93,.4);
  --st-approved-fg:#8FE3B6; --st-approved-bg:rgba(60,197,131,.15); --st-approved-dot:#3CC583; --st-approved-line:rgba(60,197,131,.36);
  --art-area:#E6E6E6; --art-area-line:#CECECE; --art-shadow:0 4px 16px rgb(0 0 0 / 18%);
  --li-bg:rgba(56,140,230,.16); --li-fg:#A9CFF5; --li-line:rgba(120,175,235,.4);
  --ig-bg:rgba(170,80,200,.18); --ig-fg:#E2B8F0; --ig-line:rgba(200,140,225,.4);
  --font:"Avenir Next","Avenir","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --mast-h:56px;
}
:root[data-ui="light"]{
  color-scheme:light;
  --bg:#E2E3E5; --bg-2:#F7F7F8; --band:#6E6F73;
  --electric:#2201F0; --electric-hover:#3A1DFF; --electric-bright:#2201F0; --accent-shadow:rgba(34,1,240,.22);
  --glow-a:rgba(255,255,255,.95); --glow-b:rgba(110,111,115,.26); --glow-c:rgba(255,255,255,.4);
  --logo-opacity:.35;
  --glass:rgba(255,255,255,.6); --glass-line:rgba(110,111,115,.24);
  --glass-shadow:0 24px 60px rgba(40,41,45,.14),inset 0 1px 0 rgba(255,255,255,.8);
  --mast:rgba(110,111,115,.95); --mast-line:rgba(255,255,255,.2); --mast-ink:#FFFFFF; --mast-ink-2:#F4F4F5; --mast-muted:#E6E6E8;
  --mast-ctl:rgba(255,255,255,.14); --mast-ctl-line:rgba(255,255,255,.34);
  --card:rgba(255,255,255,.96); --card-hover:#FFFFFF; --card-line:rgba(110,111,115,.22);
  --card-shadow:0 1px 2px rgba(40,41,45,.08); --lift-shadow:0 10px 24px rgba(40,41,45,.16);
  --pop:rgba(255,255,255,.97); --pop-shadow:0 24px 56px rgba(40,41,45,.22);
  --solid:rgba(250,250,251,.98); --solid-head:#FFFFFF; --drawer-shadow:-24px 0 60px rgba(40,41,45,.18);
  --inset:#F3F3F4; --inset-line:rgba(110,111,115,.2);
  --divider:rgba(110,111,115,.17); --out-day:rgba(110,111,115,.06);
  --ctl:#FFFFFF; --ctl-hover:#F6F6F7; --ctl-line:rgba(110,111,115,.32);
  --dash:rgba(110,111,115,.45);
  --field:#FFFFFF; --field-focus:#FFFFFF; --field-line:rgba(110,111,115,.38);
  --ink:#232427; --ink-2:#4A4B4F; --muted:#6E6F73; --on-accent:#FFFFFF;
  --press:rgba(34,1,240,.08); --press-line:rgba(34,1,240,.45);
  --more-bg:rgba(34,1,240,.07); --more-bg-hover:rgba(34,1,240,.13); --more-line:rgba(34,1,240,.3);
  --info-bg:rgba(34,1,240,.06); --info-line:rgba(34,1,240,.25);
  --overlay:rgba(40,41,45,.32);
  --toast-bg:#2A2B2E; --toast-fg:#FFFFFF;
  --warn-bg:#B42318; --warn-fg:#FFFFFF;
  --art-bg:#EDEDEE;
  --avatar-ed-bg:rgba(34,1,240,.1); --avatar-ed-fg:#2201F0; --avatar-ed-line:rgba(34,1,240,.25);
  --avatar-ap-bg:#6E6F73; --avatar-ap-fg:#FFFFFF;
  --st-draft-fg:#4A4B4F; --st-draft-bg:#EEEEEF; --st-draft-dot:#8A8B90; --st-draft-line:#D4D4D7;
  --st-pending-fg:#8A4A00; --st-pending-bg:#FFF3D9; --st-pending-dot:#E39A0E; --st-pending-line:#F2D48F;
  --st-changes-fg:#A12218; --st-changes-bg:#FDEAE7; --st-changes-dot:#E2493C; --st-changes-line:#F3BDB6;
  --st-approved-fg:#0B6A3D; --st-approved-bg:#E2F5EA; --st-approved-dot:#1E9E5F; --st-approved-line:#B2DFC5;
  --li-bg:#E8F2FC; --li-fg:#084B83; --li-line:#BDD7EF;
  --ig-bg:#F5EAFB; --ig-fg:#792B91; --ig-line:#E3C5EE;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--band)}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit}
img,video{max-width:100%}
:focus-visible{outline:2px solid var(--electric-bright);outline-offset:2px}
::selection{background:rgba(47,107,255,.35)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ico{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:-3px}
.wrap{max-width:1440px;margin-inline:auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
@media (max-width:760px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* Backdrop: glows + large logo, fixed, never repeated */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(62vw 48vw at 6% -14%,var(--glow-a),transparent 64%),
    radial-gradient(58vw 46vw at 104% 106%,var(--glow-b),transparent 66%),
    radial-gradient(44vw 30vw at 52% 42%,var(--glow-c),transparent 72%),
    linear-gradient(168deg,var(--bg-2) 0%,var(--bg) 62%)}
.bg-logo{position:absolute;right:-5vw;bottom:-2vw;width:min(94vw,1600px);max-width:none;height:auto;opacity:var(--logo-opacity);user-select:none;-webkit-user-drag:none}

/* Masthead */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--mast);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--mast-line);color:var(--mast-ink)}
.masthead :focus-visible{outline-color:var(--mast-ink)}
.mast-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding-block:0}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-logo{display:block;height:22px;width:auto}
.brand-div{width:1px;height:20px;background:var(--mast-ctl-line)}
.brand-title{color:var(--mast-ink-2);font-size:13.5px;font-weight:600;white-space:nowrap}
.mast-tools{display:flex;align-items:center;gap:12px;min-width:0}
.mode-btn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:9px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.mode-btn:hover{border-color:var(--mast-ink)}
.mode-btn .ico{width:17px;height:17px}
.role{display:flex;align-items:center;gap:12px}
.role-who{font-size:13px;color:var(--mast-ink-2);white-space:nowrap}
.role-label{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mast-muted);border:1px dashed var(--mast-ctl-line);border-radius:4px;padding:3px 7px;white-space:nowrap}
.seg{display:inline-flex;padding:3px;border-radius:10px;gap:2px;background:var(--ctl);border:1px solid var(--ctl-line)}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:13px;height:32px;padding:0 13px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:background-color .18s var(--ease),color .18s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--electric);color:var(--on-accent);box-shadow:0 4px 14px var(--accent-shadow)}
.masthead .seg{background:var(--mast-ctl);border-color:var(--mast-ctl-line)}
.masthead .seg button{color:var(--mast-ink-2)}
.masthead .seg button:hover{color:var(--mast-ink)}
.masthead .seg button[aria-pressed="true"]{color:var(--on-accent)}
.seg .sm{display:none}
@media (max-width:900px){.role-who{display:none}}
@media (max-width:820px){.brand-div,.brand-title{display:none}}
@media (max-width:560px){.seg .lg{display:none}.seg .sm{display:inline}.role-label{display:none}.mast-tools{gap:8px}}

/* Main + notice */
.main{position:relative;z-index:1;padding-block:12px 32px}
.notice{margin-bottom:12px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.notice-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.notice-text{display:inline-flex;align-items:flex-start;gap:8px}
.notice-details{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px;padding:10px 14px;max-width:92ch;border-radius:10px;background:var(--inset);border:1px solid var(--inset-line)}
.notice-text .ico{width:15px;height:15px;color:var(--electric-bright);margin-top:1px}
.notice.warn .notice-text .ico{color:var(--st-pending-dot)}
.link-btn{background:none;border:0;padding:0;color:var(--electric-bright);font-weight:700;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link-btn:hover{text-decoration-thickness:2px;color:var(--ink)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:border-color .18s var(--ease),background-color .18s var(--ease),transform .18s var(--ease)}
.btn:hover:not([disabled]){border-color:var(--press-line);background:var(--ctl-hover)}
.btn-primary{background:var(--electric);border-color:var(--electric);color:var(--on-accent);box-shadow:0 6px 20px var(--accent-shadow)}
.btn-primary:hover:not([disabled]){background:var(--electric-hover);border-color:var(--electric-hover)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{color:var(--st-changes-fg)}
.btn-warn{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn-fg);box-shadow:none}
.btn-warn:hover:not([disabled]){background:var(--warn-bg);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ink);cursor:pointer;padding:0;transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.icon-btn:hover:not([disabled]){border-color:var(--press-line);background:var(--ctl-hover)}
.icon-btn .ico{width:18px;height:18px}
.icon-btn.sm{width:28px;height:28px;border-radius:7px}
.icon-btn.sm .ico{width:14px;height:14px}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

/* Glass panel */
.panel{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.35);backdrop-filter:blur(var(--glass-blur)) saturate(1.35);border:1px solid var(--glass-line);border-radius:22px;box-shadow:var(--glass-shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 18px;padding:12px 16px}
.month-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-pair{display:flex;gap:6px}
.month-title{font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.15;min-width:9.4em;margin-right:4px}
.toolbar-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (min-width:1100px){.panel-head{flex-wrap:nowrap}.month-nav,.toolbar-end{flex-wrap:nowrap}}
.context{display:contents}
.ctx-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--st-line);background:var(--st-bg);color:var(--st-fg);font-weight:800;font-size:12.5px;cursor:pointer;transition:border-color .18s var(--ease)}
.ctx-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--st-dot)}
.ctx-btn:hover{border-color:var(--st-dot)}

/* Filters */
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding:0 16px 12px}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ink-2);font-weight:700;font-size:12.5px;cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease),color .18s var(--ease)}
.fchip .ico{width:14px;height:14px}
.fchip:hover{border-color:var(--press-line);color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--press);border-color:var(--press-line);color:var(--ink)}
.fchip.st .dot{width:7px;height:7px;border-radius:50%;background:var(--st-dot)}
.fchip.st[aria-pressed="true"]{background:var(--st-bg);border-color:var(--st-dot);color:var(--st-fg)}
.fcount{font-variant-numeric:tabular-nums;font-weight:800;opacity:.75}
.fsummary{display:flex;gap:12px;align-items:center;margin-left:auto;font-size:12.5px;color:var(--muted)}

/* Status colors */
[data-status="draft"]{--st-fg:var(--st-draft-fg);--st-bg:var(--st-draft-bg);--st-dot:var(--st-draft-dot);--st-line:var(--st-draft-line)}
[data-status="pending"]{--st-fg:var(--st-pending-fg);--st-bg:var(--st-pending-bg);--st-dot:var(--st-pending-dot);--st-line:var(--st-pending-line)}
[data-status="changes"]{--st-fg:var(--st-changes-fg);--st-bg:var(--st-changes-bg);--st-dot:var(--st-changes-dot);--st-line:var(--st-changes-line)}
[data-status="approved"]{--st-fg:var(--st-approved-fg);--st-bg:var(--st-approved-bg);--st-dot:var(--st-approved-dot);--st-line:var(--st-approved-line)}
.status-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;line-height:1.25;padding:3px 9px 3px 8px;border-radius:999px;background:var(--st-bg);color:var(--st-fg);border:1px solid var(--st-line)}
.status-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--st-dot);flex:0 0 auto}
.sample-tag{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--dash);border-radius:4px;padding:1px 6px;line-height:1.5;white-space:nowrap}

/* Month grid */
.cal{border-top:1px solid var(--divider)}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:9px 12px 8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(120px,auto);border-top:1px solid var(--divider)}
.day{position:relative;min-width:0;padding:6px;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);display:flex;flex-direction:column;gap:6px}
.day:nth-child(7n){border-right:0}
.cal-grid .day:nth-last-child(-n+7){border-bottom:0}
.cal-grid .day:nth-last-child(7){border-bottom-left-radius:21px}
.cal-grid .day:last-child{border-bottom-right-radius:21px}
.day.out{background:var(--out-day)}
.day.out .day-num{color:var(--muted);opacity:.7;font-weight:600}
.day.expanded{z-index:6}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:22px}
.day-num{display:grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:999px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.day.today .day-num{background:var(--electric);color:var(--on-accent);box-shadow:0 0 0 4px var(--more-bg),0 0 18px var(--accent-shadow)}
.day-tools{display:flex;align-items:center;gap:4px;min-width:0}
.day-add{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .18s var(--ease),color .18s var(--ease)}
.day:hover .day-add,.day-add:focus-visible{opacity:1}
.day-add:hover{border-color:var(--ctl-line);color:var(--ink)}
.day-posts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{position:relative;width:100%;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:8px;border-radius:8px;background:var(--card);border:1px solid var(--card-line);border-left:3px solid var(--st-dot);container-type:inline-size;color:var(--ink);cursor:pointer;box-shadow:var(--card-shadow);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease),background-color .18s var(--ease)}

/* List */

/* Hover preview */
.preview{position:fixed;z-index:45;width:330px;max-width:calc(100vw - 24px);background:var(--pop);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--pop-shadow);overflow:hidden;pointer-events:none;animation:pv-in .18s var(--ease)}

.modal-head h2{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.modal-sub{font-size:13px;color:var(--muted);margin-top:4px}
.modal-body{padding:18px 24px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal-body > p{line-height:1.6;max-width:62ch;color:var(--ink-2)}
.modal-body > p strong{color:var(--ink)}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--inset-line);background:var(--solid-head)}
.modal-foot .spacer{margin-right:auto;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .modal-backdrop.sheet{padding:0;place-items:stretch}
  .modal.wide{width:100%;max-height:none;height:100%;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}
  .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}
}

/* Form */
#post-form{display:flex;flex-direction:column;gap:22px}
.fsec{display:flex;flex-direction:column;gap:16px;padding-top:20px;border-top:1px solid var(--inset-line)}
.fsec:first-child{border-top:0;padding-top:0}
.fsec-title{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--electric-bright)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
@media (max-width:640px){.grid-2{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;margin:0;padding:0;min-width:0}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl > label,.ctl > legend,.lbl{font-size:13.5px;font-weight:800;padding:0}
.ctl > legend{margin-bottom:6px}
.req{color:var(--st-changes-fg)}
.opt-label{font-weight:600;color:var(--muted);font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.err{font-size:13px;font-weight:700;color:var(--st-changes-fg)}
input[type="text"],input[type="date"],input[type="time"],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:9px;padding:10px 12px;width:100%;min-width:0;transition:border-color .18s var(--ease),background-color .18s var(--ease)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input[type="date"],input[type="time"],select{height:44px}
select{cursor:pointer}
select:invalid,select option[value=""]{color:var(--muted)}
select option{color:var(--ink);background:var(--solid-head)}
textarea{resize:vertical;line-height:1.6;min-height:96px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--electric);outline-offset:0;border-color:var(--electric);background:var(--field-focus)}
.ctl.invalid input,.ctl.invalid select,.ctl.invalid textarea,textarea[aria-invalid="true"]{border-color:var(--st-changes-dot)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt span{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--field-line);border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;background:var(--field);color:var(--ink-2);transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.opt input:checked + span{border-color:var(--electric);background:var(--press);color:var(--ink);box-shadow:inset 0 0 0 1px var(--electric)}
.opt input:focus-visible + span{outline:2px solid var(--electric-bright);outline-offset:2px}
.drop{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px dashed var(--dash);border-radius:14px;background:var(--inset);cursor:pointer;transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.drop:hover,.drop.over{border-color:var(--electric);background:var(--more-bg)}
.drop:focus-within{outline:2px solid var(--electric-bright);outline-offset:2px}
.drop .ico{width:24px;height:24px;color:var(--electric-bright)}
.drop-text{display:flex;flex-direction:column;gap:2px;font-size:14px}
.drop.busy{opacity:.6;pointer-events:none}
.art-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px}
.art-item{border:1px solid var(--inset-line);border-radius:12px;overflow:hidden;background:var(--inset);display:flex;flex-direction:column;min-width:0}
.ai-media{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--art-bg);overflow:hidden}
.ai-media > img,.ai-media > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ai-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 6px 2px 8px}
.ai-n{font-size:12px;font-weight:800}
.ai-btns{display:flex;gap:3px}
.ai-name{font-size:11.5px;color:var(--muted);padding:0 8px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Toasts, footer */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:11px 18px;border-radius:12px;box-shadow:var(--pop-shadow);font-weight:700;font-size:14px;line-height:1.4;animation:toast-in .2s var(--ease)}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes toast-in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.foot{position:relative;z-index:1;padding-block:0 32px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--ink-2)}
.foot p{max-width:92ch}

/* Importação de publicações */
.imp{display:flex;flex-direction:column;gap:22px}
.imp-sec{display:flex;flex-direction:column;gap:12px}
.imp-file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.imp-file-row:focus-within .btn{outline:2px solid var(--electric-bright);outline-offset:2px}
#imp-json{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.5;min-height:170px;white-space:pre;overflow:auto}
.imp-files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.imp-files li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--inset-line);background:var(--inset)}
.imp-fname{display:inline-flex;align-items:center;gap:8px;min-width:0;flex:1;font-weight:700;font-size:13.5px}
.imp-fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-list{margin:4px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.imp-review{display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
#imp-issues:focus{outline:none}
#imp-issues:empty,#imp-missing:empty{display:none}
.callout code,.meta-foot code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;padding:0 4px;border-radius:4px;background:var(--inset);border:1px solid var(--inset-line);overflow-wrap:anywhere}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;margin-top:4px}
.check input{width:18px;height:18px;margin:0;accent-color:var(--electric)}
input[aria-invalid="true"]{border-color:var(--st-changes-dot)}
.chip.just-added,.li.just-added{outline:2px solid var(--electric);outline-offset:2px;animation:just-added 1.3s var(--ease) 3}
@keyframes just-added{0%,100%{box-shadow:var(--card-shadow)}50%{box-shadow:0 0 0 6px var(--more-bg),0 0 24px var(--accent-shadow)}}

/* Exclusão e lixeira: ícones discretos, sem pesar no calendário */
.dr-trash{border-color:transparent;background:transparent;color:var(--muted)}
.dr-trash:hover:not([disabled]),.dr-trash:focus-visible{color:var(--st-changes-fg);border-color:var(--st-changes-line);background:var(--st-changes-bg)}
.trash-btn{position:relative;border-color:transparent;background:transparent;color:var(--muted)}
.trash-btn:hover:not([disabled]){color:var(--ink);border-color:var(--ctl-line);background:var(--ctl)}
.trash-count{position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--solid-head);border:1px solid var(--ctl-line);color:var(--ink-2);font-size:10px;font-weight:800;line-height:14px;text-align:center;font-variant-numeric:tabular-nums}
.trash-btn.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.trash-fx{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:84px;height:92px;margin-left:-42px;z-index:66;pointer-events:none;filter:drop-shadow(0 16px 30px rgba(0,0,0,.35))}
.trash-fx svg{display:block;width:100%;height:100%;overflow:visible}
.trash-fx .trash-body{fill:var(--solid-head);stroke:var(--ink-2);stroke-width:2.5;stroke-linejoin:round}
.trash-fx .trash-lines{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.trash-fx .trash-lid{transform-box:fill-box;transform-origin:0% 100%}
.trash-fx .trash-lid rect{fill:var(--solid-head);stroke:var(--ink-2);stroke-width:2.5}
.del-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--inset-line);border-left:3px solid var(--st-dot);background:var(--inset)}
.del-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.del-theme{font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.trash-intro{font-size:13px;color:var(--muted)}
.trash-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.trash-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--inset-line);border-left:3px solid var(--st-dot);background:var(--inset)}
.ti-main{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 300px}
.ti-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.ti-theme{font-weight:800;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ti-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ti-when{font-size:12.5px;color:var(--muted)}
.ti-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:16px}
.toast-btn{background:none;border:0;padding:0;color:inherit;font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:760px){.dr-head{padding-right:108px}.dr-trash{position:absolute;top:12px;right:calc(max(12px,env(safe-area-inset-right,0px)) + 46px)}}

/* Identificação simulada na visão do aprovador */
.ident{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0;font-size:13px;color:var(--mast-ink-2);white-space:nowrap}
.ident:empty{display:none}
.ident-who{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ident-name{font-weight:800;color:var(--mast-ink);overflow:hidden;text-overflow:ellipsis}
.ident-visitor .ico{width:15px;height:15px}
.ident-btn{display:inline-flex;align-items:center;flex:0 0 auto;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--mast-ctl-line);background:var(--mast-ctl);color:var(--mast-ink);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:border-color .18s var(--ease)}
.ident-btn:hover{border-color:var(--mast-ink)}
@media (max-width:900px){
  .mast-inner{flex-wrap:wrap;row-gap:0}
  .mast-tools{margin-left:auto}
  .ident{order:3;flex-basis:100%;margin-left:0;justify-content:space-between;padding-bottom:8px}
  .ident[data-kind="editor"]{display:none}
}
.ident-form{display:flex;flex-direction:column;gap:16px}
.modal-body > p.ident-note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:12.5px;line-height:1.5}
.ident-note .ico{width:15px;height:15px;margin-top:1px;flex:0 0 auto}
.cmt-cargo{color:var(--ink-2);font-weight:700;font-size:13px}
.cmt-meta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.avatar[data-role="reviewer"]{background:var(--avatar-ap-bg);color:var(--avatar-ap-fg)}
.avatar[data-role="unknown"]{background:var(--ctl);color:var(--muted);border:1px dashed var(--dash)}
.cmt-locked{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:6px;padding:14px 16px;border-radius:12px;border:1px dashed var(--dash);background:var(--inset);font-size:14px;color:var(--ink-2)}
.cmt-locked > .ico{color:var(--muted)}
.cmt-locked .btn{margin-left:auto}

/* Etiqueta da rede: a mesma em cards, lista, prévia e detalhes. A cor fica só na etiqueta, nunca no card. */
.social-badge{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 7px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.2;letter-spacing:0;text-transform:none;white-space:nowrap;vertical-align:middle}
.social-badge .ico,.social-badge svg{width:14px;height:14px;flex-shrink:0}
.social-badge[data-network="linkedin"]{background:var(--li-bg);color:var(--li-fg);border:1px solid var(--li-line)}
.social-badge[data-network="instagram"]{background:var(--ig-bg);color:var(--ig-fg);border:1px solid var(--ig-line)}
@container (max-width:110px){.chip .social-badge{gap:4px;padding:2px 5px;font-size:11px}}
@container (max-width:84px){.chip .social-badge .ico{display:none}}
.dr-fmt{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Mobile: lighter glass, list first */
@media (max-width:760px){
  :root{--glass-blur:6px}
  :root:not([data-ui="light"]){--glass:rgba(8,20,58,.74)}
  :root[data-ui="light"]{--glass:rgba(255,255,255,.8)}
  .main{padding-block:12px 28px}
  .panel{border-radius:18px}
  .panel-head{padding:12px 14px 8px}
  .month-title{font-size:21px;min-width:0;width:100%}
  .toolbar-end{width:100%}
  .toolbar-end .btn-primary{flex:1}
  .view-toggle{display:none}
  .filters{gap:8px;padding:0 14px 10px}
  .fgroup{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-block:2px}
  .fgroup::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto}
  .fsummary{margin-left:0}
  .list{padding:14px 12px 16px}
  .li{grid-template-columns:62px minmax(0,1fr);gap:12px}
  .li-thumb{width:62px;height:78px}
  .bg-logo{width:150vw;right:-38vw;bottom:-4vw}
  .preview{display:none}
}

img[data-art]:not([src]),video[data-art]:not([src]){opacity:0}

/* No backdrop-filter support: keep text on an opaque ground */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  :root{--glass:rgba(8,20,58,.94);--mast:rgba(4,10,34,.96);--pop:#0B1844;--solid:#0A1640}
  :root[data-ui="light"]{--glass:rgba(255,255,255,.95);--mast:#6E6F73;--pop:#FFFFFF;--solid:#FAFAFB}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chip:hover,.chip:focus-visible,.li:hover,.li:focus-visible{transform:none}
}

<script>
(() => {
'use strict';
document.documentElement.lang = 'pt-BR';

/* ============================================================================
   Arquitetura preparada para a etapa conectada
   ----------------------------------------------------------------------------
   • Policy.can(user, action, post): regra única de permissão. Na etapa 2 ela
     roda no servidor; a interface só esconde botões, quem decide é o servidor.
   • createLocalBackend(): a API que a interface usa (listPosts, createPost,
     updatePost, submit, approve, requestChanges, addComment, deletePost).
     Na etapa 2 entra um createHttpBackend() com as mesmas assinaturas,
     chamando rotas autenticadas.
   • FileStore: arquivos da arte. Aqui usa IndexedDB; na etapa 2 vira
     armazenamento de objetos com URLs assinadas.
   • Modelo: calendars → posts → versions (cópia imutável a cada envio),
     comments (sempre ligados a uma versão) e history (trilha de auditoria).
     Todo post tem calendarId; o link do aprovador será um convite que dá
     acesso só a esse calendário.
   ========================================================================== */

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => `${p}-${Math.random().toString(36).slice(2, 8)}${Date.now().toString(36).slice(-4)}`;
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const toISODate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISODate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const nf = new Intl.NumberFormat('pt-BR');

const WD_SHORT = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const WD_LONG = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MON_SHORT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fmtDay = iso => { const d = parseISODate(iso); return `${WD_SHORT[d.getDay()]}, ${d.getDate()} ${MON_SHORT[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDayLong = iso => { const d = parseISODate(iso); return `${WD_LONG[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const fmtStamp = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} às ${pad(d.getHours())}h${pad(d.getMinutes())}`; };
const truncate = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); if (t.length <= n) return t; const cut = t.slice(0, n); return cut.slice(0, Math.max(cut.lastIndexOf(' '), n - 12)).replace(/[,.;:]$/, '') + '…'; };
const initials = name => String(name).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

/* ---------- Domínio ---------- */
const NETWORKS = { instagram: { label: 'Instagram', limit: 2200 }, linkedin: { label: 'LinkedIn', limit: 3000 } };
const FORMATS = { image: 'Imagem', carousel: 'Carrossel', video: 'Vídeo' };
const STATUS = { draft: 'Rascunho', pending: 'Aguardando aprovação', changes: 'Ajustes solicitados', approved: 'Aprovado' };
const STATUS_ORDER = ['draft', 'pending', 'changes', 'approved'];
const ROLE_LABEL = { editor: 'Editor', approver: 'Aprovador', reviewer: 'Revisor', visitor: 'Visitante' };
/* Usados só pelos exemplos já existentes (autoria antiga, sem cargo). */
const DEMO_USERS = {
  editor: { id: 'u-editor', name: 'Ana Ribeiro', role: 'editor', calendarId: 'loy4biz' },
  approver: { id: 'u-approver', name: 'Carlos Mendes', role: 'approver', calendarId: 'loy4biz' }
};

/* ---------- Identidade e autoria ----------
   Protótipo: na visão do aprovador, a pessoa declara nome e cargo (simulação, não é login).
   Versão conectada: identidade e cargo virão de um convite validado no servidor para este calendário.
   O cargo escolhido no formulário é só um rótulo e nunca concede permissão real de aprovação. */
const CARGOS = ['Coordenação', 'Gerência', 'Diretoria'];
const CALENDAR_ID = 'loy4biz';
const EDITOR_USER = { id: 'u-editor', name: 'Ana Ribeiro', role: 'editor', calendarId: CALENDAR_ID };
const VISITOR_USER = { id: null, name: null, role: 'visitor', calendarId: CALENDAR_ID };
const reviewerUser = part => ({ id: part.id, name: part.name, cargo: part.cargo, role: 'reviewer', calendarId: CALENDAR_ID, source: part.source || 'self-declared' });
/* Cópia de quem agiu, gravada junto de cada registro: trocar a identificação depois não muda a autoria. */
const actorSnapshot = u => ({ id: u.id || null, name: u.name || null, cargo: u.cargo || null, role: u.role });
/* Lê a autoria de registros novos (actor) e antigos (só nome e papel). */
function actorOf(rec, nameField = 'by', fallbackRole = null) {
  if (!rec) return null;
  if (rec.actor && rec.actor.name) return rec.actor;
  const name = rec[nameField];
  if (!name) return null;
  return { id: null, name, cargo: null, role: rec.role || fallbackRole, legacy: true };
}
const roleLabelOf = a => (a && (a.cargo || ({ editor: 'Editor', approver: 'Aprovador' })[a.role])) || '';
const actorLabel = a => !a ? 'Autor não identificado' : (roleLabelOf(a) ? `${a.name} · ${roleLabelOf(a)}` : a.name);
const CONTENT_FIELDS = ['date', 'time', 'network', 'format', 'title', 'subtitle', 'caption', 'visual'];
const FIELD_LABELS = { theme: 'tema', date: 'data', time: 'horário', network: 'rede social', format: 'formato', title: 'título da arte', subtitle: 'subtítulo', caption: 'legenda', visual: 'proposta visual', art: 'arte' };

const artKey = arr => (arr || []).map(a => a.id).join('|');
const isVideo = a => String(a && a.mime || '').startsWith('video/');

      await new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });

    } catch (e) { mem.set(id, blob); return 'memory'; }
  }
  async function get(id) {
    if (mem.has(id)) return mem.get(id);
    const db = await open(); if (!db) return null;
    return new Promise(res => { try { const rq = db.transaction('files').objectStore('files').get(id); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); } catch (e) { res(null); } });
  }

/* ---------- Backend local (simula a API e as verificações do servidor) ---------- */
function createLocalBackend() {
  const KEY = 'loy4biz.calendario.dados.v1';
  let db = null; let persistent = true;
  function load() {
    if (db) return db;
    try { const raw = localStorage.getItem(KEY); if (raw) { db = JSON.parse(raw); if (db && Array.isArray(db.posts)) return db; } } catch (e) { persistent = false; }
    db = { schema: 1, posts: buildSamples() }; save(); return db;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); persistent = true; return true; } catch (e) { persistent = false; return false; } }
  function findExport(calendarId, exportId) { return load().posts.find(p => p.calendarId === calendarId && p.origin && p.origin.exportId === exportId) || null; }
  const exportSummary = p => ({ id: p.id, theme: p.theme, date: p.date, time: p.time, status: p.status, trashed: !!p.trashed });
  const now = () => new Date().toISOString();
  /* Publicações na lixeira ficam fora de todas as ações comuns (editar, enviar, aprovar, comentar). */
  function find(user, id, includeTrashed = false) {
    const p = load().posts.find(x => x.id === id);
    if (!p || p.calendarId !== user.calendarId || (p.trashed && !includeTrashed)) throw new ApiError('NOT_FOUND', 'Publicação não encontrada neste calendário. Ela pode ter sido excluída.');
    return p;
  }
  function guard(user, action, post) { if (!Policy.can(user, action, post)) throw new ApiError('FORBIDDEN', 'Esta ação não é permitida na visão atual.'); }
  const event = (p, user, type, extra = {}) => p.history.push({ id: uid('ev'), at: now(), by: user.name, role: user.role, actor: actorSnapshot(user), type, version: p.version, ...extra });
  const pickContent = d => { const o = {}; CONTENT_FIELDS.forEach(f => { o[f] = d[f] || ''; }); o.art = clone(d.art || []); return o; };
  /* Comentário com identificador próprio e cópia de nome e cargo no momento da ação. */
  const commentRecord = (user, p, text, kind, parentId, requestId, at = now()) => ({
    id: requestId || uid('c'), at, author: user.name, role: user.role, actor: actorSnapshot(user),
    kind, version: p.version, text: String(text).trim(), parentId: parentId || null
  });
  function decisionGuard(user, p, expectedVersion) {
    if (user.role !== 'reviewer') throw new ApiError('FORBIDDEN', 'Identifique-se como participante para aprovar ou solicitar ajustes.');
    if (p.status !== 'pending' || (lastVersion(p) && lastVersion(p).decision)) throw new ApiError('ALREADY_DECIDED', 'Esta versão já recebeu uma decisão.');
    if (expectedVersion != null && expectedVersion !== p.version) throw new ApiError('STALE', 'A publicação mudou enquanto você revisava. Reabra para ver a versão atual.');
    guard(user, 'decide', p);
  }

  return {
    get persistent() { load(); return persistent; },
    async listPosts(user) { return clone(load().posts.filter(p => p.calendarId === user.calendarId && !p.trashed)); },
    async listTrash(user) {
      if (!Policy.can(user, 'viewTrash')) throw new ApiError('FORBIDDEN', 'Só quem gerencia publicações vê a lixeira.');
      return clone(load().posts.filter(p => p.calendarId === user.calendarId && p.trashed));
    },
    async createPost(user, data, opts = {}) {
      guard(user, 'create');
      if (!String(data.theme || '').trim()) throw new ApiError('INVALID', 'Informe o tema ou nome interno.');
      const p = { id: uid('pub'), calendarId: user.calendarId, isSample: false, theme: data.theme.trim(), ...pickContent(data), status: 'draft', version: 1, approval: null, invalidated: null, versions: [], comments: [], history: [], createdAt: now(), updatedAt: now(), createdBy: user.name, createdByActor: actorSnapshot(user) };
      if (opts.origin) p.origin = opts.origin;
      event(p, user, opts.origin ? 'imported' : 'created', opts.origin ? { exportId: opts.origin.exportId } : {});
      const store = load(); const hadStorage = persistent; store.posts.push(p);
      /* Se o navegador recusar a gravação, desfaz tudo: nada de registro pela metade. */
      if (!save() && hadStorage) {
        store.posts = store.posts.filter(x => x !== p);
        throw new ApiError('SAVE_FAILED', 'Não foi possível salvar neste navegador (o armazenamento pode estar cheio ou bloqueado). Nada foi adicionado; o conteúdo continua aqui para tentar de novo.');
      }
      return clone(p);
    },
    async findImport(user, exportId) {
      guard(user, 'import');
      const p = findExport(user.calendarId, String(exportId || '').trim());
      return p ? exportSummary(p) : null;
    },
    /* Importação: revalida com a lista de campos permitidos e cria pelo mesmo fluxo de "Nova publicação".
       O objeto importado nunca é gravado direto; só os campos conhecidos passam. */
    async importPost(user, data, origin) {
      guard(user, 'import');
      const o = origin || {};
      const env = ImportContract.checkEnvelope({ schemaVersion: o.schemaVersion, exportId: o.exportId, calendarId: o.calendarId, timezone: o.timezone, post: {} }, user.calendarId);
      if (env.length) throw new ApiError('INVALID', env.join(' '));
      const exportId = o.exportId.trim();
      const dup = findExport(user.calendarId, exportId);
      if (dup) throw Object.assign(new ApiError('DUPLICATE', 'Esta exportação já foi importada.'), { existing: exportSummary(dup) });
      const clean = {};
      ['theme', 'date', 'time', 'network', 'format', 'title', 'subtitle', 'caption', 'visual'].forEach(k => { clean[k] = typeof data[k] === 'string' ? data[k] : ''; });
      clean.time = normalizeTime(clean.time);
      clean.art = (Array.isArray(data.art) ? data.art : []).filter(a => a && a.kind === 'file' && typeof a.id === 'string')
        .map(a => ({ id: a.id, kind: 'file', name: String(a.name || ''), mime: String(a.mime || ''), w: Number(a.w) || 0, h: Number(a.h) || 0, size: Number(a.size) || 0 }));
      const issues = ImportContract.validateFields(clean, clean.art.length);
      if (issues.length) throw new ApiError('INVALID', issues.map(i => i.msg).join(' '));
      return this.createPost(user, clean, { origin: { type: 'import', exportId, schemaVersion: IMPORT_SCHEMA_VERSION, calendarId: user.calendarId, timezone: IMPORT_TIMEZONE, sourceName: String(o.sourceName || ''), importedAt: now(), importedBy: actorSnapshot(user) } });
    },
    async updatePost(user, id, data, opts = {}) {
      const p = find(user, id); guard(user, 'edit', p);
      const fields = changedFields(p, data); const themeChanged = (data.theme || '').trim() !== p.theme;
      if (!fields.length && !themeChanged) return { post: clone(p), effect: 'none' };
      let effect = 'saved';
      if (fields.length && p.status === 'approved' && !opts.acknowledgeInvalidation) throw new ApiError('NEEDS_ACK', 'Esta alteração invalida a aprovação. Confirme para salvar.');
      if (fields.length && p.status === 'pending' && !opts.acknowledgeWithdraw) throw new ApiError('NEEDS_ACK', 'Esta alteração retira a publicação da aprovação. Confirme para salvar.');
      Object.assign(p, pickContent(data)); p.theme = data.theme.trim(); p.updatedAt = now();
      event(p, user, 'edited', { fields: themeChanged ? [...fields, 'theme'] : fields });
      if (fields.length && p.status === 'approved') {
        const v = p.versions.find(x => x.version === p.approval.version); if (v) v.invalidatedAt = now();
        p.invalidated = { version: p.approval.version, at: now(), by: user.name, actor: actorSnapshot(user), fields, approvedBy: p.approval.by, approvedActor: p.approval.actor || null };
        p.approval = null; p.status = 'draft'; effect = 'invalidated';
        event(p, user, 'approval_invalidated', { fields });
      } else if (fields.length && p.status === 'pending') {
        const v = lastVersion(p); if (v) v.decision = { type: 'withdrawn', at: now(), by: user.name, actor: actorSnapshot(user) };
        p.status = 'draft'; effect = 'withdrawn';
        event(p, user, 'withdrawn', { fields });
      }
      save(); return { post: clone(p), effect };
    },
    async submit(user, id) {
      const p = find(user, id); guard(user, 'submit', p);
      const missing = missingForSubmit(p); if (missing.length) throw new ApiError('INCOMPLETE', `Para enviar, preencha: ${missing.join(' e ')}.`);
      const resend = p.versions.length > 0; const v = nextVersion(p);
      p.version = v; p.versions.push({ version: v, submittedAt: now(), submittedBy: user.name, submittedActor: actorSnapshot(user), snapshot: snapshotOf(p), decision: null });
      p.status = 'pending'; p.invalidated = null; p.updatedAt = now();
      event(p, user, resend ? 'resubmitted' : 'submitted'); save(); return clone(p);
    },
    /* Decisões: uma aprovação válida basta; sem etapas entre cargos. A versão esperada evita decidir
       sobre conteúdo que mudou e impede registro duplicado por cliques repetidos. */
    async approve(user, id, note, expectedVersion) {
      const p = find(user, id); decisionGuard(user, p, expectedVersion);
      const at = now(); const v = lastVersion(p); const actor = actorSnapshot(user);
      v.decision = { type: 'approved', at, by: user.name, actor };
      p.approval = { version: p.version, by: user.name, byId: user.id, actor, at };
      p.status = 'approved'; p.updatedAt = at;
      if (String(note || '').trim()) p.comments.push(commentRecord(user, p, note, 'approval', null, null, at));
      event(p, user, 'approved'); save(); return clone(p);
    },
    async requestChanges(user, id, text, expectedVersion, requestId) {
      const p = find(user, id); decisionGuard(user, p, expectedVersion);
      if (!String(text || '').trim()) throw new ApiError('COMMENT_REQUIRED', 'Escreva o que precisa ser ajustado. O comentário é obrigatório.');
      const at = now(); const c = commentRecord(user, p, text, 'changes', null, requestId, at);
      p.comments.push(c); lastVersion(p).decision = { type: 'changes', at, by: user.name, actor: actorSnapshot(user), commentId: c.id };
      p.status = 'changes'; p.updatedAt = at;
      event(p, user, 'changes_requested'); save(); return clone(p);
    },
    async addComment(user, id, text, parentId = null, requestId = null) {
      const p = find(user, id); guard(user, 'comment', p);
      if (requestId && p.comments.some(c => c.id === requestId)) return clone(p); /* clique repetido: já registrado */
      if (!String(text || '').trim()) throw new ApiError('INVALID', 'Escreva o comentário antes de enviar.');
      if (parentId && !p.comments.some(c => c.id === parentId)) throw new ApiError('INVALID', 'Comentário original não encontrado.');
      p.comments.push(commentRecord(user, p, text, parentId ? 'reply' : 'comment', parentId, requestId));
      save(); return clone(p);
    },
    /* Participante declarado no protótipo. Na versão conectada, substituído pelo aceite de um convite. */
    async registerParticipant(data) {
      const name = String(data.name || '').replace(/\s+/g, ' ').trim();
      if (!name) throw new ApiError('INVALID', 'Informe seu nome completo.');
      if (!CARGOS.includes(data.cargo)) throw new ApiError('INVALID', 'Selecione seu cargo.');
      const part = { id: uid('part'), name, cargo: data.cargo, source: 'self-declared', calendarId: CALENDAR_ID, createdAt: now() };
      const store = load(); if (!Array.isArray(store.participants)) store.participants = [];
      store.participants.push(part); save(); return clone(part);
    },
    /* Excluir = mover para a lixeira. Status, aprovação, versões, comentários e histórico ficam intactos,
       então restaurar devolve a publicação exatamente como estava. */
    async trashPost(user, id) {
      const p = find(user, id); guard(user, 'delete', p);
      event(p, user, 'trashed');
      p.trashed = { at: now(), by: user.name, actor: actorSnapshot(user), status: p.status };
      save(); return clone(p);
    },
    async restorePost(user, id) {
      const p = find(user, id, true); guard(user, 'restore', p);
      delete p.trashed; p.updatedAt = now();
      event(p, user, 'restored'); save(); return clone(p);
    },
    /* Exclusão definitiva: só a partir da lixeira. Apaga também os arquivos da arte e das versões. */
    async purgePost(user, id) {
      const p = find(user, id, true); guard(user, 'purge', p);
      db.posts = db.posts.filter(x => x.id !== id); save();
      const files = new Set();
      [p.art || [], ...(p.versions || []).map(v => (v.snapshot && v.snapshot.art) || [])].forEach(list => list.forEach(a => { if (a.kind === 'file') files.add(a.id); }));
      files.forEach(fid => FileStore.remove(fid));
      return true;
    },
    async reset() { db = { schema: 1, posts: buildSamples(), participants: (db && db.participants) || [] }; save(); await FileStore.clear(); return true; }
  };
}

const ART_INDEX = new Map();
function artTag(item, cls, opts = {}) {
  ART_INDEX.set(item.id, item);
  if (isVideo(item)) return `<video class="${cls}" data-art="${esc(item.id)}" ${opts.controls ? 'controls' : ''} muted playsinline preload="metadata" aria-label="${esc(opts.alt || item.name || 'Vídeo')}"></video>`;
  return `<img class="${cls}" data-art="${esc(item.id)}" alt="${esc(opts.alt || '')}" decoding="async">`;
}
async function resolveArtUrl(item) {
  if (!item) return null;
  if (item.kind === 'gen') return genArtUrl(item);
  if (item.kind === 'pending') return item.url || null; /* arquivo ainda não salvo (conferência da importação) */
  return FileStore.url(item.id);
}
function hydrate(root) {
  $$('[data-art]:not([data-hydrated])', root).forEach(el => {
    el.setAttribute('data-hydrated', '');
    const item = ART_INDEX.get(el.dataset.art);
    resolveArtUrl(item).then(url => {
      if (!el.isConnected) return;
      if (url) { el.src = el.tagName === 'VIDEO' && !el.controls ? `${url}#t=0.1` : url; }
      else el.outerHTML = '<span class="missing">Arquivo indisponível neste navegador</span>';
    });
  });
}

      { transform: 'scale(.86, .7)', opacity: 1, borderRadius: '28px', offset: 0.3 },
      { transform: 'scale(.02, .025)', opacity: 0.25, borderRadius: '50%' }

    can.animate([{ transform: 'none' }, { transform: 'translateY(3px) scale(1.06,.93)', offset: 0.5 }, { transform: 'none' }], { duration: 300, easing: 'ease-out' });
    await play(lid, [{ transform: 'rotate(-44deg)' }, { transform: 'rotate(5deg)', offset: 0.72 }, { transform: 'rotate(0deg)' }], { duration: 280, easing: 'ease-in', fill: 'forwards' });
    await new Promise(r => setTimeout(r, 140));

  } catch (e) { /* animação é só enfeite: segue mesmo se falhar */ }
  can.remove();
}

async function storeArtFile(file) {
  checkArtFile(file);

    try {
      const bmp = await createImageBitmap(file); w = bmp.width; h = bmp.height; const MAX = 2400;
      if (file.size > 1.5 * 1024 * 1024 || Math.max(w, h) > MAX) {
        const s = Math.min(1, MAX / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        const g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
        const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86)); if (out) { blob = out; w = c.width; h = c.height; }
      }
      bmp.close && bmp.close();

  }
  const id = uid('arq'); const where = await FileStore.put(id, blob);
  if (where === 'memory' && await FileStore.available()) { FileStore.remove(id); throw new Error(`Não foi possível guardar “${file.name}” neste navegador. O armazenamento pode estar cheio.`); }

  if (e.key === 'Escape') { if (layers.length) { e.preventDefault(); layers[layers.length - 1].requestClose(); return; } if (state.open) { e.preventDefault(); closeDrawer(); return; } if (state.expandedDay) { e.preventDefault(); collapseDay(); return; } hidePreview(); }
  if (e.key === 'Tab' && layers.length) focusTrap(e, layers[layers.length - 1].el);
});
addEventListener('scroll', hidePreview, { passive: true });
addEventListener('resize', hidePreview);
mqMobile.addEventListener('change', () => { hidePreview(); renderMain(); });
const setMast = () => document.documentElement.style.setProperty('--mast-h', `${el.masthead.offsetHeight}px`);
if ('ResizeObserver' in window) new ResizeObserver(setMast).observe(el.masthead);
setMast();

refresh().then(() => { if (state.perspective === 'approver' && !state.identity) openIdentityModal(); });
})();
</script>
</body>
